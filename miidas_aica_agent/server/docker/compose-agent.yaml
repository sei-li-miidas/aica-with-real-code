name: ai-ca
services:
  agent-server:
    container_name: agent-server
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: gunicorn application:app -c gunicorn_config.py
    ports:
      - "${AICA_AGENT_PORT}:${AICA_AGENT_PORT}"
    environment:
      - PYTHONPATH=/home/app/web
      - TZ=Asia/Tokyo
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AICA_AGENT_PORT=${AICA_AGENT_PORT}
      - AICA_AGENT_DB_HOST=${AICA_AGENT_DB_HOST}
      - AICA_AGENT_DB_PORT=${AICA_AGENT_DB_PORT}
      - AICA_AGENT_DB_USER=${AICA_AGENT_DB_USER}
      - AICA_AGENT_DB_PASSWORD=${AICA_AGENT_DB_PASSWORD}
      - AICA_AGENT_DB_NAME=${AICA_AGENT_DB_NAME}
      - AICA_AGENT_DB_SSLMODE=${AICA_AGENT_DB_SSLMODE}
      - AICA_AGENT_MCP_ENDPOINT=${AICA_AGENT_MCP_ENDPOINT}
      - AICA_AGENT_API_ENDPOINT=${AICA_AGENT_API_ENDPOINT}
      - AICA_PYTHON_FERNET_AES_128_CBC_KEY_LV3=${AICA_PYTHON_FERNET_AES_128_CBC_KEY_LV3}
      - AICA_PYTHON_FERNET_AES_128_CBC_KEY_LV5=${AICA_PYTHON_FERNET_AES_128_CBC_KEY_LV5}
      - OPENAI_AGENTS_DISABLE_TRACING=${OPENAI_AGENTS_DISABLE_TRACING}
      - AICA_AGENT_MIIDAS_API_ENDPOINT=${AICA_AGENT_MIIDAS_API_ENDPOINT}
      - AICA_ENV=${AICA_ENV}
      - AICA_REDIS_HOST=${AICA_REDIS_HOST:-redis}
      - AICA_REDIS_PORT=${AICA_REDIS_PORT:-6379}
    volumes:
      - ../src/aica_agent:/home/app/web/:ro
      - ../tests:/home/app/tests
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/agent/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-server-debug:
    extends: agent-server
    command: python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m uvicorn application:app --reload --host 0.0.0.0 --port ${AICA_AGENT_PORT} --limit-concurrency 100 --timeout-keep-alive 30
    ports:
      - "${AICA_AGENT_PORT}:${AICA_AGENT_PORT}"
      - 5678:5678

  localstack:
    image: localstack/localstack:latest
    container_name: aica-localstack
    ports:
      - "4567:4566"
    environment:
      - SERVICES=s3
      - PERSISTENCE=1
      - DEBUG=1
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
    volumes:
      - ../docker/files/ca/Cloudflare_Gateway_CA.pem:/usr/local/share/ca-certificates/Cloudflare_Gateway_CA.crt:ro
      - ../docker/localstack:/etc/localstack/init/ready.d:ro
      - ~/aica/data/localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  redis:
    image: redis:7.2
    container_name: aica-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  localstack_data:
  redis_data:
