name: python-ci

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

  push:
    branches: [master, release, develop]

concurrency:
  # ブランチ（PR）内でワークフローの同時実行を防止
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ${{ matrix.project }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      matrix:
        include:
          - &project_server
            project: server
            path: server
            source: src/aica_agent
            run_pytest: true
            pytest_workdir: tests/unit
          - &project_cli
            project: cli
            path: cli
            source: src/aica_batch
            run_pytest: true
            pytest_workdir: tests/unit
          - &project_e2e
            project: e2e
            path: e2e
            source: src/aica_client
            run_pytest: false
            pytest_workdir: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install tooling
        run: python -m pip install ruff pip-audit

      - name: Install project dependencies
        working-directory: ${{ matrix.path }}
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        working-directory: ${{ matrix.path }}
        run: ruff check --output-format=github ${{ matrix.source }}

      - name: Run pip-audit
        working-directory: ${{ matrix.path }}
        run: pip-audit --progress-spinner off

  build-test:
    name: ${{ matrix.project }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        include:
          - *project_server
          - *project_cli
          - *project_e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        working-directory: ${{ matrix.path }}
        run: python -m pip install -r requirements-dev.txt

      - name: Setup environment file
        working-directory: ${{ matrix.path }}
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
            echo "Copied .env.example to .env"
          else
            echo "No .env.example found, skipping"
          fi

      - name: Run unit tests
        if: ${{ matrix.run_pytest }}
        working-directory: ${{ matrix.path }}
        env:
          PYTHONPATH: ${{ matrix.source }}
        run: |
          if [ -f .env ]; then
            set -a
            source .env
            set +a
          fi
          pytest -v --cov=${{ matrix.source }} --cov-report=term-missing

      - name: Skip unit tests
        if: ${{ ! matrix.run_pytest }}
        run: echo "No unit tests for ${{ matrix.project }}"
