[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AICA-Client"
version = "0.0.1"
description = "AICAエージェントテストのE2Eクライアント"
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp~=3.14.1",
    "boto3~=1.42",
    "openai~=2.30",
    "pydantic~=2.12",
    "PyYAML~=6.0",
    "SQLAlchemy~=2.0",
    "types-PyYAML~=6.0",
    "websockets~=16.0",
]

[project.optional-dependencies]
test = [
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov~=7.0.0",
]
dev = [
    "pre-commit~=4.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aica_client"]
